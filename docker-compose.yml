version: '3.8'

services:
  autenticacion:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    image: crediya-autenticacion
    container_name: autenticacion
    environment:
      SERVER_PORT: 8081

      # ---- R2DBC (WebFlux) contra tu Postgres local ----
      SPRING_R2DBC_URL: r2dbc:postgresql://host.docker.internal:5432/postgres?schema=crediya_auth
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: 73657869

      # (opcional) si tu código lee estas props custom:
      ADAPTERS_R2DBC_HOST: host.docker.internal
      ADAPTERS_R2DBC_PORT: 5432
      ADAPTERS_R2DBC_DATABASE: postgres
      ADAPTERS_R2DBC_SCHEMA: crediya_auth
      ADAPTERS_R2DBC_USERNAME: postgres
      ADAPTERS_R2DBC_PASSWORD: 73657869
    ports:
      - "8081:8081"
