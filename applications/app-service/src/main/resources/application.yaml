server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: "CrediYa_Auth"
  devtools:
    add-properties: false

  # R2DBC (WebFlux)
  r2dbc:
    host: ${ADAPTERS_R2DBC_HOST}
    port: ${ADAPTERS_R2DBC_PORT:5432}
    database: ${ADAPTERS_R2DBC_DATABASE:postgres}
    schema: ${ADAPTERS_R2DBC_SCHEMA}
    username: ${ADAPTERS_R2DBC_USERNAME}
    password: ${ADAPTERS_R2DBC_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

routes:
  paths:
    usuarios: "/api/v1/usuarios"
    usuariosById: "/api/v1/usuarios/{id}"
    login: "/api/v1/login"

adapters:
  r2dbc:
    url: ${SPRING_R2DBC_URL}
    username: ${SPRING_R2DBC_USERNAME}
    password: ${SPRING_R2DBC_PASSWORD}

logging:
  level:
    root: "INFO"
    co.com.autenticacion: "TRACE"
    org.springframework.r2dbc: "DEBUG"
    org.springframework.web.reactive.function.server: TRACE

jwt:
  secret: "G7fvdS+3h8JkLmZpS1aUqXy9B!eH@Q#L"
  algorithm: "HS256"

migration:
  hash-passwords: false
